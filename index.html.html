<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قناة المعلاق للأفلام - MaalaqFilm</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'Tajawal', 'sans-serif'] },
          colors: {
            brand: { gold: '#F59E0B', darkGold: '#D97706', charcoal: '#0C0C0E', pitch: '#050507', red: '#EF4444' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-pitch text-gray-200">

  <!-- الواجهة الرئيسية (Hero Banner) لفيلم الكرفان -->
  <div class="relative w-full h-[500px] sm:h-[600px] overflow-hidden mb-8 border-b border-zinc-800">
    <!-- خلفية البوستر مع التدرج السينمائي -->
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('poster.png'), url('https://img.youtube.com/vi/1S_G-pI46MQ/maxresdefault.jpg');">
      <div class="absolute inset-0 bg-gradient-to-t from-brand-pitch via-brand-pitch/70 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-r from-brand-pitch via-brand-pitch/60 to-transparent"></div>
    </div>

    <!-- محتوى الواجهة -->
    <div class="relative z-10 max-w-7xl mx-auto h-full flex flex-col justify-end p-6 sm:p-12 pb-16">
      <div class="max-w-2xl">
        <span class="inline-block bg-brand-gold text-black text-xs font-black px-3 py-1 rounded-full mb-3 shadow-lg">
          العرض الرئيسي الأصلي ⭐ 9.9
        </span>
        <h1 class="text-4xl sm:text-6xl font-black text-white mb-4 leading-tight drop-shadow-md">
          فيلم الكرفان
        </h1>
        <p class="text-sm sm:text-base text-gray-300 mb-6 leading-relaxed">
          إنتاج أصلي حصري من المعلاق. رحلة مليئة بالمشاعر والبحث عن الحقيقة في طرق لا تقودك للمنزل بل لذاتك.
        </p>
        <div class="flex flex-wrap gap-4 items-center">
          <button onclick="playMovieById(17)" class="bg-brand-gold text-black font-bold text-base px-8 py-3.5 rounded-xl hover:bg-amber-400 hover:scale-105 transition duration-300 flex items-center gap-2 shadow-xl shadow-amber-500/10">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            مشاهدة الفيلم الآن
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- القسم الرئيسي للمحتوى -->
  <div id="movies-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 p-10">
    <!-- سيتم ملء الشبكة برمجياً -->
  </div>

  <script>
    const allMovies = [
      {
        id: 17,
        title: `فيلم الكرفان`,
        category: `دراما`,
        year: 2026,
        rating: 9.9,
        synopsis: `إنتاج أصلي حصري من المعلاق. رحلة مليئة بالمشاعر والبحث عن الحقيقة في طرق لا تقودك للمنزل بل لذاتك.`,
        cover: `poster.png`,
        theme: `from-amber-700 to-black`,
        videoUrl: `https://www.youtube.com/watch?v=1S_G-pI46MQ`
      },
      {
        id: 1,
        title: `رحلة البحرين الكارثية مع صويلح`,
        category: `كوميدي`,
        year: 2024,
        rating: 9.8,
        synopsis: `مغامرة كوميدية فريدة عبر الحدود يقطعها طاقم المعلاق داخل الجمس الأخضر التاريخي.`,
        cover: `https://img.youtube.com/vi/rSxqWAfiwLU/maxresdefault.jpg`,
        theme: `from-amber-600 to-orange-950`,
        videoUrl: `https://www.youtube.com/watch?v=rSxqWAfiwLU`
      }
    ];

    function playMovieById(id) {
        const m = allMovies.find(movie => movie.id === id);
        if (m) {
            window.open(m.videoUrl, '_blank');
        }
    }

    function renderMovies() {
      const grid = document.getElementById('movies-grid');
      grid.innerHTML = ''; 
      allMovies.forEach(m => {
        grid.innerHTML += `
          <div class="bg-zinc-900 p-4 rounded-xl shadow-lg border border-zinc-800 hover:border-brand-gold transition-all duration-300">
            <img src="${m.cover}" onerror="this.src='https://img.youtube.com/vi/1S_G-pI46MQ/maxresdefault.jpg'" class="w-full h-48 object-cover rounded-lg mb-4" alt="${m.title}">
            <h3 class="text-white font-bold mb-2">${m.title}</h3>
            <p class="text-xs text-zinc-400 mb-4">${m.synopsis}</p>
            <button onclick="playMovieById(${m.id})" class="bg-brand-gold text-black px-4 py-2 rounded-lg text-sm font-bold w-full hover:bg-amber-500 transition">مشاهدة الآن</button>
          </div>
        `;
      });
    }
    
    renderMovies();
  </script>
</body>
</html>
